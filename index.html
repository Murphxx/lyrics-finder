<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyrics Finder</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="theme-toggle">
        <i class="fas fa-moon"></i>
    </div>
    <div class="container">
        <h1><i class="fas fa-music"></i> Lyrics Finder</h1>
        <div class="search-box">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="artist" placeholder="Artist Name">
            </div>
            <div class="input-group">
                <i class="fas fa-music"></i>
                <input type="text" id="song" placeholder="Song Name">
            </div>
            <button onclick="getLyrics()">
                <i class="fas fa-search"></i> Find Lyrics
            </button>
        </div>

        <div class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Loading lyrics...</p>
        </div>

        <div id="result" class="result">
            <div class="result-header">
                <h2 id="song-title"></h2>
                <p id="artist-name"></p>
            </div>
            <div id="lyrics"></div>
        </div>

        <div class="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <p>Lyrics not found. Please try again.</p>
        </div>

        <div class="recent-searches">
            <h3><i class="fas fa-history"></i> Recent Searches</h3>
            <div id="recent-list" class="recent-list"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
